scenario:
  id: energy
  name: energy management

problem:
  n_param: 1
  n_var: 384
  n_eq: 193
  n_ineq: 480
  N: 96
  n_state: 1
  m_input: 2
  seed: 2026
  Delta_t: 0.25
  B: 500.0
  c_e: 0.1
  c_p: 19.19
  c_d: 10.0
  mu: 0.8
  a: 50.0
  S_u: 700.0
  S_c: 50.0
  S_m: 50.0
  delta: 0.01
  kappa_m: 10.0
  kappa_c: 10.0
  s_min: 0.2
  s_max: 0.8
  u_min: -700.0
  u_max: 700.0
  pc_min: 0.1
  pc_max: 10.0
  m_min: -50.0
  m_max: 50.0
  soc_initial_min: 0.25
  soc_initial_max: 0.75
  forecast_day: 0
  schema_version: energy_soc_v5_physical_ineq

data:
  source_subdir: data/energy
  load_file: load/load_7days.csv
  pv_file: generator/PV_48h_15-min_150kW_San_Diego.csv
  root_subdir: data/energy_soc_day_0
  n_samples: 20000
  train_percent: 0.8
  val_percent: 0.1
  test_percent: 0.1

neural_net:
  hidden_layers: [512, 512]
  mode: correction

optimizer:
  learning_rate: 0.001
  decay_rate: 0.9
  transition_steps: 1000
  weight_decay: 0.0001

training:
  batch_size: 256
  n_epochs: 1000
  n_admm: 40
  gamma_r: 1.0
  gamma_p: 1.0
  gamma_c: 1.0
  gamma_s: 1000.0
  eval_step: 5000

admm:
  max_iter: 1000
  tolerance: 0.01
  rho: 10.0
  solver: CLARABEL

dc3:
  device: cpu
  epochs: 500
  batch_size: 2
  learning_rate: 0.001
  hidden_size: 256
  dropout: 0.2
  soft_weight: 1000.0
  soft_weight_eq_fraction: 0.5
  use_completion: true
  use_train_correction: true
  use_test_correction: true
  correction_mode: partial
  correction_train_steps: 5
  correction_test_max_steps: 200
  correction_tolerance: 0.0001
  correction_learning_rate: 0.00001
  correction_momentum: 0.0
  results_save_frequency: 100
  print_frequency: 100
