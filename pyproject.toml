[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-to-optimization"
version = "0.1.0"
description = "Learning-based methods for nonlinear convex optimization"
authors = [
    { name = "Your Name", email = "your_email@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "scikit-learn",
    "tqdm",
    "optax",
    "flax",
    "cvxpy",
    "jax",
    "torch",
]

[tool.setuptools.packages.find]
where = ["."]